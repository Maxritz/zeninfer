name: ZenInfer CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python test prerequisites
        run: python -m pip install numpy
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DZEN_BUILD_AVX2=ON -DZEN_BUILD_TESTS=ON -DZEN_BUILD_SERVER=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: python scripts/ctest_ci.py --test-dir build -C Release --output-on-failure
      - name: Upload Windows executables
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: zeninfer-windows-x64
          path: build/Release/*.exe

  linux-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python test prerequisites
        run: python -m pip install --upgrade pip && python -m pip install numpy
      - name: Configure with coverage
        run: cmake -S . -B build-coverage -DCMAKE_BUILD_TYPE=Debug -DZEN_BUILD_AVX2=OFF -DZEN_BUILD_TESTS=ON -DZEN_BUILD_SERVER=ON '-DCMAKE_CXX_FLAGS=--coverage -fprofile-update=atomic' -DCMAKE_EXE_LINKER_FLAGS=--coverage
      - name: Build
        run: cmake --build build-coverage --parallel 2
      - name: Test
        run: python scripts/ctest_ci.py --test-dir build-coverage --output-on-failure
      - name: Install gcovr
        run: python -m pip install gcovr
      # The scalar GEMM shape sweep alone legitimately executes over 10 billion
      # dot-product loop iterations. Keep the large counts rather than dropping
      # them as parse errors; still reject negative and implausibly huge counts.
      - name: Generate coverage report
        run: gcovr --root . --filter 'src/' --filter 'kernels/' --gcov-suspicious-hits-threshold 100000000000 --xml-pretty --output coverage.xml
      - uses: actions/upload-artifact@v4
        with:
          name: zeninfer-coverage
          path: coverage.xml
